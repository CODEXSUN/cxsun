name: cxsun-demo

services:
  platform-api:
    image: cxsun/demo-api:local
    build:
      context: ../..
      dockerfile: .container/demo/Dockerfile
      target: api
    container_name: cxsun-demo-api
    restart: unless-stopped
    env_file: deploy.env
    ports:
      - "127.0.0.1:17210:17210"
    volumes:
      - ./deploy.env:/app/.env:ro
      - demo-storage:/app/storage
      - demo-media-data:/app/storage/media
      - demo-codex-cli:/opt/cxsun-codex-cli
      - demo-codex-auth:/var/lib/cxsun/zetro-codex
    networks:
      - cxapp-network

  platform-web:
    image: cxsun/demo-web:local
    build:
      context: ../..
      dockerfile: .container/demo/Dockerfile
      target: web
    container_name: cxsun-demo-web
    restart: unless-stopped
    environment:
      PLATFORM_API_PORT: "17210"
    depends_on:
      platform-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:17220:80"
    networks:
      - cxapp-network

  media:
    image: ${FILEBROWSER_BASE_IMAGE:?required}
    container_name: cxsun-demo-media
    restart: unless-stopped
    command:
      - --address
      - 0.0.0.0
      - --port
      - "80"
      - --root
      - /srv
      - --database
      - /database/filebrowser.db
    ports:
      - "127.0.0.1:17290:80"
    volumes:
      - demo-media-data:/srv
      - demo-media-db:/database
    networks:
      - cxapp-network

volumes:
  demo-storage:
    name: cxsun-demo-storage
  demo-media-data:
    name: cxsun-demo-media-data
  demo-media-db:
    name: cxsun-demo-media-db
  demo-codex-cli:
    name: cxsun-demo-codex-cli
  demo-codex-auth:
    name: cxsun-demo-codex-auth

networks:
  cxapp-network:
    name: cxapp-network
    external: true
